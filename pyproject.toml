[project]
name = "mai-garden"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Orglix", email = "aurelcalonne@pm.me" }
]
requires-python = ">=3.14"
dependencies = [
    "litellm>=1.100.0",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "sqlmodel>=0.0.42",
]

[project.scripts]
mai-garden = "mai_garden:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.6",
]
